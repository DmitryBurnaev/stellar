name: Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_call:

permissions:
  contents: read

jobs:
  trivy:
    name: trivy-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [image, fs]
    env:
      TRIVY_VERSION: "0.76.2"
      TRIVY_SEVERITY: "CRITICAL,HIGH,MEDIUM,LOW"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install verified Trivy binary
        shell: bash
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version

      - name: Build service image
        if: matrix.target == 'image'
        run: |
          docker build --platform linux/amd64 --target service \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "stellar:scan-$GITHUB_SHA" .
          image_id=$(docker image inspect "stellar:scan-$GITHUB_SHA" --format '{{.Id}}')
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Scan image
        if: matrix.target == 'image'
        run: |
          "$RUNNER_TEMP/trivy" image --cache-dir "$RUNNER_TEMP/trivy-cache" --disable-telemetry --skip-version-check \
            --config "" --ignorefile "" --image-src docker --scanners vuln \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed=false --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-image.json" "$IMAGE_ID"

      - name: Scan filesystem
        if: matrix.target == 'fs'
        run: |
          "$RUNNER_TEMP/trivy" fs --cache-dir "$RUNNER_TEMP/trivy-cache" --disable-telemetry --skip-version-check \
            --config "" --ignorefile "" --skip-check-update --scanners vuln,misconfig --include-dev-deps \
            --severity "$TRIVY_SEVERITY" --ignore-unfixed=false --exit-code 0 \
            --format json --output "$RUNNER_TEMP/trivy-fs.json" .

      - name: Validate report
        env:
          TARGET: ${{ matrix.target }}
        run: |
          report="$RUNNER_TEMP/trivy-$TARGET.json"
          jq -e '.SchemaVersion == 2 and (.Results | type == "array")' "$report" > /dev/null
          if [ "$TARGET" = image ]; then
            jq -e --arg image_id "$IMAGE_ID" --arg revision "$GITHUB_SHA" \
              '.ArtifactType == "container_image" and .Metadata.ImageID == $image_id and
               .Metadata.ImageConfig.architecture == "amd64" and
               .Metadata.ImageConfig.config.Labels["org.opencontainers.image.revision"] == $revision' "$report" > /dev/null
          else
            jq -e 'any(.Results[]; .Type == "uv" and .Target == "uv.lock") and
              any(.Results[]; .Type == "dockerfile" and .Target == "Dockerfile")' "$report" > /dev/null
          fi

      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trivy-${{ matrix.target }}
          path: ${{ runner.temp }}/trivy-${{ matrix.target }}.json
          retention-days: 30
          if-no-files-found: error

      - name: Fail on findings
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "$RUNNER_TEMP/trivy" convert --cache-dir "$RUNNER_TEMP/trivy-cache" \
            --config "" --ignorefile "" --scanners vuln,misconfig \
            --severity "$TRIVY_SEVERITY" --exit-code 1 "$RUNNER_TEMP/trivy-$TARGET.json"

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Gitleaks and scan Git history
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o "$archive"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: gitleaks
          path: ${{ runner.temp }}/gitleaks.json
          retention-days: 30
          if-no-files-found: error

  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify TruffleHog and scan the checkout
        shell: bash
        run: |
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          curl -fsSL --retry 3 https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.12/trufflehog_3.90.12_linux_amd64.tar.gz -o "$archive"
          echo "318fd1e8af68b54f4465437208582003a5948293ea401c5c67bb55f17e4e2102  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trufflehog
          "$RUNNER_TEMP/trufflehog" filesystem . --no-verification --results=unverified --json --fail |
            jq -c '{SourceMetadata, DetectorName, DecoderName}' > "$RUNNER_TEMP/trufflehog.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: trufflehog
          path: ${{ runner.temp }}/trufflehog.jsonl
          retention-days: 30
          if-no-files-found: error

  opengrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify Opengrep and scan Python source
        shell: bash
        run: |
          binary="$RUNNER_TEMP/opengrep"
          curl -fsSL --retry 3 https://github.com/opengrep/opengrep/releases/download/v1.33.1/opengrep_manylinux_x86 -o "$binary"
          echo "46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808  $binary" | sha256sum --check --strict
          chmod +x "$binary"
          rules="$RUNNER_TEMP/opengrep-rules"
          git init "$rules"
          git -C "$rules" fetch --depth 1 https://github.com/opengrep/opengrep-rules.git f1d2b562b414783763fd02a6ed2736eaed622efa
          git -C "$rules" checkout --detach FETCH_HEAD
          report="$RUNNER_TEMP/opengrep.json"
          scan_status=0
          # These maintainability rules misclassify boolean attributes and valid returns.
          "$binary" scan --config "$rules/python" --no-rewrite-rule-ids \
            --exclude-rule is-function-without-parentheses --exclude-rule return-not-in-function \
            --strict --error --json . |
            jq -e '{
              results: [.results[] | {check_id, path, start, "end": .end, severity: .extra.severity}],
              errors: [.errors[] | {code, level, type}]
            }' > "$report" ||
            scan_status=$?
          if [[ -s "$report" ]]; then
            jq -r '.results[] | "\(.path):\(.start.line): \(.severity) \(.check_id)"' "$report"
          fi
          exit "$scan_status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: opengrep
          path: ${{ runner.temp }}/opengrep.json
          retention-days: 30
          if-no-files-found: error
