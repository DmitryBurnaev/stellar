name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: stellar-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  scans:
    uses: ./.github/workflows/scan.yaml

  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Resolve the release image and version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, checks, scans]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: service
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Stellar server group control panel
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Save the platform digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/$ARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  publish-image:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify both image indexes
        shell: bash
        run: |
          images=()
          for arch in amd64 arm64; do
            read -r digest < "$RUNNER_TEMP/digests/$arch"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            images+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${images[@]}"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > "$RUNNER_TEMP/version.json"
          jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]
          ' "$RUNNER_TEMP/version.json"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          docker buildx imagetools inspect --raw "$IMAGE:latest" > "$RUNNER_TEMP/latest.json"
          cmp "$RUNNER_TEMP/version.json" "$RUNNER_TEMP/latest.json"

  create-release:
    needs: [prepare, publish-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Create the GitHub Release
        shell: bash
        run: |
          printf 'Stellar %s for linux/amd64 and linux/arm64.\n\n```sh\ndocker pull %s:%s\n```\n' \
            "$VERSION" "$IMAGE" "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Stellar $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
